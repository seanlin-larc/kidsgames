<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Games</title>
<style>
:root{--bg:#f3f4f6;--panel:#ffffff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;}
@media (prefers-color-scheme: dark){:root{--bg:#111827;--panel:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--accent:#60a5fa;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;padding:24px 16px}
main{max-width:640px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.8rem}
.intro{margin:0 0 20px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
li a{display:block;padding:14px 16px;color:inherit;text-decoration:none}
li a:hover,li a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.name{font-size:1.2rem;font-weight:700;color:var(--accent)}
.desc{display:block;margin-top:2px}
.meta{display:block;margin-top:4px;font-size:.85rem;color:var(--muted)}
footer{margin-top:28px;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Kids Games</h1>
  <p class="intro">Brain-teasing games and puzzles. Pick one to play.</p>

  <!--
    TO ADD A GAME:
    1. Make a new folder with a lowercase name, for example: word-ladder/
    2. Put the game in word-ladder/index.html
    3. Copy one <li> block below and change the link, name, and text.
    Use relative links only (href="word-ladder/"), never href="/word-ladder/".
  -->
  <ul>
    <li>
      <a href="minesweeper/">
        <span class="name">Minesweeper</span>
        <span class="desc">Use the number clues to find every hidden mine.</span>
        <span class="meta">Logic · Ages 7+ · 5 levels, 8×8 to 24×24</span>
      </a>
    </li>
  </ul>

  <footer>More games coming soon.</footer>
</main>
</body>
</html>
